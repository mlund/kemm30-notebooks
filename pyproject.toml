[project]
name = "kemm30"
version = "0.1.0"
description = "KEMM30 lecture notebooks and slides"
requires-python = ">=3.12"
license = "CC-BY-SA-4.0"
# Ranges allow safe upgrades; uv.lock holds the exact versions.
dependencies = [
    "jupyterlab>=4.4.7,<5",
    "ipykernel>=6.30.1,<7",
    "numpy>=2.3.2,<3",
    "matplotlib>=3.10.6,<4",
]

[tool.uv]
# Notebooks only; nothing to build or install as a package.
package = false
